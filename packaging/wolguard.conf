# wolguard configuration for Keenetic/Entware routers.
#
# Installed as /opt/etc/wolguard.conf.
# Validate after editing:
#   /opt/bin/wolguard --config /opt/etc/wolguard.conf check-config
#
# The file is TOML. Unknown keys are rejected on purpose so that typos do not
# silently fall back to defaults. Global settings must come before the first
# [[host]] block.

# How often every enabled host is probed, in seconds.
check_interval_secs = 10

# ICMP echo timeout, in milliseconds.
ping_timeout_ms = 1000

# Number of consecutive failed probes before a magic packet is sent.
failures_before_wake = 3

# Minimum delay between two wake attempts for the same host, in seconds.
wake_retry_secs = 600

# Upper bound on wake attempts per host per hour.
max_wakes_per_hour = 6

# Send a magic packet right after the daemon starts, even for hosts that were
# never seen online. Useful after a router reboot.
wake_on_start = true

# Where magic packets go: "auto" derives the LAN broadcast address from the
# kernel routing table, or use an explicit IPv4 address (e.g. 192.168.1.255).
broadcast = "auto"

# Wake-on-LAN UDP port. 9 is the traditional service port, 7 is also common.
wol_port = 9

# Log file, or "-" to log to stdout (the init script redirects it to the file
# below when the daemon is started at boot).
log_file = "/opt/var/log/wolguard.log"

# PID file used to keep a single daemon or dashboard instance running.
pid_file = "/opt/var/run/wolguard.pid"

# Log every failed probe instead of only the first one per outage. Useful when
# diagnosing wake-ups, noisy on a stable network.
verbose_probes = false

# --- hosts ---------------------------------------------------------------
#
# One [[host]] block per machine:
#   name  - identifier used by `wolguard wake <name>` and the dashboard
#   ip    - static IPv4 address of the host on the LAN
#   mac   - AA:BB:CC:DD:EE:FF, aa-bb-cc-dd-ee-ff or aabb.ccdd.eeff
#   enabled - optional, defaults to true
#
# Optional per-host overrides: check_interval_secs, wake_retry_secs,
# failures_before_wake, max_wakes_per_hour.
#
# The MAC below is a placeholder: replace it with the real address from the
# router's DHCP client list before relying on wake-ups.

[[host]]
name = "server"
ip = "192.168.1.10"
mac = "AA:BB:CC:DD:EE:FF"
enabled = true
