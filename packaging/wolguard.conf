# wolguard configuration for Keenetic/Entware routers.
#
# Installed as /opt/etc/wolguard.conf.
#
# The file is TOML. Unknown keys are rejected on purpose so that typos do not
# silently fall back to defaults. Global settings must come before the first
# [[host]] or [[pppoe.target]] block.
#
# You can edit it by hand, or use the management console:
#   wolguard setup                 interactive first-run wizard
#   wolguard                       dashboard (TUI) on a TTY
#   wolguard hosts ...             host management
#   wolguard pppoe ...             PPPoE scan/target/rules
#   wolguard settings ...          global settings
#   wolguard check-config          validate and print resolved settings
#
# The CLI/TUI preserve comments, write atomically and keep a .bak copy.

# --- global switches ------------------------------------------------------

# Set to false to disable all LAN host monitoring; PPPoE watching is separate.
wol_enabled = true

# How often every enabled host is probed, in seconds.
check_interval_secs = 10

# ICMP echo timeout, in milliseconds.
ping_timeout_ms = 1000

# Number of consecutive failed probes before a magic packet is sent.
failures_before_wake = 3

# Minimum delay between two wake attempts for the same host, in seconds.
wake_retry_secs = 600

# Upper bound on wake attempts per host per hour.
max_wakes_per_hour = 6

# Send a magic packet right after the daemon starts, even for hosts that were
# never seen online. Useful after a router reboot.
wake_on_start = true

# Where magic packets go: "auto" derives the LAN broadcast address from the
# kernel routing table, or use an explicit IPv4 address (e.g. 192.168.1.255).
broadcast = "auto"

# Wake-on-LAN UDP port. 9 is the traditional service port, 7 is also common.
wol_port = 9

# Log file, or "-" to log to stdout (the init script redirects it to the file
# below when the daemon is started at boot).
log_file = "/opt/var/log/wolguard.log"

# PID/lock file used to keep exactly one daemon instance running.
pid_file = "/opt/var/run/wolguard.pid"

# Local Unix socket used by the TUI and CLI to talk to the running daemon.
# The default lives in /tmp because some Entware USB filesystems (vfat) do not
# support Unix sockets; /tmp is tmpfs and supports them.
control_socket = "/tmp/wolguard.sock"

# Entware init script used by `wolguard service ...` and the TUI.
init_script = "/opt/etc/init.d/S99wolguard"

# Persistent PPPoE recovery/observation state. Only interfaces this daemon took
# down are restored from it; other down interfaces are left alone.
state_file = "/opt/var/run/wolguard.state"

# Log every failed probe instead of only the first one per outage.
verbose_probes = false

# --- RCI (Keenetic local control interface) -------------------------------

[rci]
url = "http://127.0.0.1:79"
# Optional X-NDMA-TKN access token (KeeneticOS 5.2+). Leave empty on firmware
# that does not require it. `wolguard rci token` can generate and store one.
token = ""
timeout_ms = 2000
# Generate a token through ndmc when RCI returns 401/403.
auto_token = true
ndmc_path = "ndmc"

# --- PPPoE white-IP watchdog ----------------------------------------------

[pppoe]
enabled = true

# "on-change": evaluate at daemon start/target enable, then on session changes
# (address change, uptime reset, observed down->up, last-change). A stable grey
# address is not re-hunted on every poll.
# "always": also hunt a stable grey address.
trigger = "on-change"

poll_secs = 15
down_secs = 5
settle_secs = 60
retry_secs = 45
max_restarts_per_hour = 12

# Extra classification patterns. Built-in special-use ranges are grey and
# everything else is white. An explicit grey pattern wins; an explicit white
# pattern can override the built-in table.
white_cidrs = []
grey_cidrs = []

# Add a block for each PPPoE interface to watch. Use `wolguard pppoe` to scan
# the router and `wolguard pppoe watch <id>` to create one. Per-target overrides
# (all optional): enabled, trigger, poll_secs, down_secs, settle_secs,
# retry_secs, max_restarts_per_hour, white_cidrs, grey_cidrs.
#
# [[pppoe.target]]
# interface = "PPPoE0"

# --- LAN hosts ------------------------------------------------------------
#
# One [[host]] block per machine:
#   name  - identifier used by `wolguard wake <name>` and the dashboard
#   ip    - static IPv4 address of the host on the LAN
#   mac   - AA:BB:CC:DD:EE:FF, aa-bb-cc-dd-ee-ff or aabb.ccdd.eeff
#   enabled - optional, defaults to true
#
# Optional per-host overrides: check_interval_secs, wake_retry_secs,
# failures_before_wake, max_wakes_per_hour.
#
# The MAC below is a placeholder: replace it with the real address from the
# router's DHCP client list before relying on wake-ups, or run
# `wolguard hosts add` / `wolguard setup`.

[[host]]
name = "server"
ip = "192.168.1.10"
mac = "AA:BB:CC:DD:EE:FF"
enabled = true
