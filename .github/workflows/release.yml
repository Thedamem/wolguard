name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: MIPS build and GitHub release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The mipsel-unknown-linux-musl target is tier 3, so nightly with rust-src
      # is required for `-Z build-std`.
      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Install Zig
        run: |
          set -euo pipefail
          ZIG_VERSION=0.15.2
          mkdir -p "$HOME/.local/opt" "$HOME/.local/bin"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/opt"
          ln -sfn "$HOME/.local/opt/zig-x86_64-linux-${ZIG_VERSION}" "$HOME/.local/opt/zig"
          ln -sfn "$HOME/.local/opt/zig/zig" "$HOME/.local/bin/zig"
          zig version

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Build static MIPS binary
        run: ./build-mips.sh

      - name: Build opkg package and install bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}-1" sh packaging/make-ipk.sh dist/wolguard-mips dist
          sh packaging/make-dist.sh

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/wolguard-mips \
            dist/wolguard_*_mipsel-3.4.ipk \
            dist/wolguard-mipsel.ipk \
            dist/wolguard-install.tar.gz \
            dist/SHA256SUMS \
            --title "wolguard ${GITHUB_REF_NAME#v}" \
            --generate-notes
