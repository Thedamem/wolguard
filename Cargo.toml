[package]
name = "wolguard"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "Wake-on-LAN guard daemon with a ratatui dashboard for Keenetic/Entware routers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Thedamem/wolguard"
homepage = "https://github.com/Thedamem/wolguard"
keywords = ["wake-on-lan", "wol", "keenetic", "entware", "router"]
categories = ["command-line-utilities", "network-programming"]
authors = ["wolguard contributors"]

[[bin]]
name = "wolguard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
